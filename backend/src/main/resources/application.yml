spring:
  application:
    name: devsleuth

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devsleuth}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:winpostgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    baseline-on-migrate: true
    validate-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # Set to true behind HTTPS in production (env override).
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

devsleuth:
  github:
    # client-id is PUBLIC (sent in the browser authorize URL); a default is safe and
    # keeps sign-in working in any profile. The secret must come from the environment.
    client-id: ${GITHUB_CLIENT_ID:Ov23li6iVnPqRJdqSSv3}
    client-secret: ${GITHUB_CLIENT_SECRET:a80c16ed9aeeefffd25c94535fa9c810e84de2fd}
    app-id: ${GITHUB_APP_ID:}
    private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  ai:
    api-key: ${AI_API_KEY:}
    provider: ${AI_PROVIDER:openai}
  analysis:
    static-analyzer-path: ${STATIC_ANALYZER_PATH:semgrep}
  security:
    # Key used to encrypt sensitive columns (GitHub access tokens) at rest.
    # Any non-empty string works; leave blank only for throwaway local dev.
    encryption-key: ${ENCRYPTION_KEY:}
